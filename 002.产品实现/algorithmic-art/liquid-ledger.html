<!DOCTYPE html>
<!--
    基于 Anthropic 算法艺术 viewer 模板
    保留：sidebar 结构 / 字体 / Anthropic 配色（UI 用）
    替换：算法 / 参数 / 颜色（艺术用）
-->
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liquid Ledger — 液态账本</title>
    <script src="https://cdn.bootcdn.net/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Lora:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --anthropic-dark: #141413;
            --anthropic-light: #faf9f5;
            --anthropic-mid-gray: #b0aea5;
            --anthropic-light-gray: #e8e6dc;
            --anthropic-orange: #d97757;
            --anthropic-blue: #6a9bcc;
            --anthropic-green: #788c5d;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--anthropic-light) 0%, #f5f3ee 100%);
            min-height: 100vh;
            color: var(--anthropic-dark);
        }
        .container {
            display: flex;
            min-height: 100vh;
            padding: 20px;
            gap: 20px;
        }
        .sidebar {
            width: 320px;
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(20, 20, 19, 0.1);
            overflow-y: auto;
            overflow-x: hidden;
        }
        .sidebar h1 {
            font-family: 'Lora', serif;
            font-size: 24px;
            font-weight: 500;
            color: var(--anthropic-dark);
            margin-bottom: 8px;
        }
        .sidebar .subtitle {
            color: var(--anthropic-mid-gray);
            font-size: 14px;
            margin-bottom: 32px;
            line-height: 1.4;
        }
        .control-section { margin-bottom: 32px; }
        .control-section h3 {
            font-size: 16px;
            font-weight: 600;
            color: var(--anthropic-dark);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .control-section h3::before {
            content: '•';
            color: var(--anthropic-orange);
            font-weight: bold;
        }
        .seed-input {
            width: 100%;
            background: var(--anthropic-light);
            padding: 12px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            margin-bottom: 12px;
            border: 1px solid var(--anthropic-light-gray);
            text-align: center;
        }
        .seed-input:focus {
            outline: none;
            border-color: var(--anthropic-orange);
            box-shadow: 0 0 0 2px rgba(217, 119, 87, 0.1);
            background: white;
        }
        .seed-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 8px;
        }
        .regen-button { margin-bottom: 0; }
        .control-group { margin-bottom: 20px; }
        .control-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: var(--anthropic-dark);
            margin-bottom: 8px;
        }
        .slider-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .slider-container input[type="range"] {
            flex: 1;
            height: 4px;
            background: var(--anthropic-light-gray);
            border-radius: 2px;
            outline: none;
            -webkit-appearance: none;
        }
        .slider-container input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: var(--anthropic-orange);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .slider-container input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.1);
            background: #c86641;
        }
        .slider-container input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            background: var(--anthropic-orange);
            border-radius: 50%;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .value-display {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: var(--anthropic-mid-gray);
            min-width: 60px;
            text-align: right;
        }
        .color-group { margin-bottom: 16px; }
        .color-group label {
            display: block;
            font-size: 12px;
            color: var(--anthropic-mid-gray);
            margin-bottom: 4px;
        }
        .color-picker-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .color-picker-container input[type="color"] {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: none;
            padding: 0;
        }
        .color-value {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: var(--anthropic-mid-gray);
        }
        .button {
            background: var(--anthropic-orange);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
        }
        .button:hover {
            background: #c86641;
            transform: translateY(-1px);
        }
        .button:active { transform: translateY(0); }
        .button.secondary { background: var(--anthropic-blue); }
        .button.secondary:hover { background: #5a8bb8; }
        .button.tertiary { background: var(--anthropic-green); }
        .button.tertiary:hover { background: #6b7b52; }
        .button-row { display: flex; gap: 8px; }
        .button-row .button { flex: 1; }
        .canvas-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 0;
        }
        #canvas-container {
            width: 100%;
            max-width: 1000px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(20, 20, 19, 0.1);
            background: white;
        }
        #canvas-container canvas {
            display: block;
            width: 100% !important;
            height: auto !important;
        }
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: var(--anthropic-mid-gray);
            min-height: 400px;
        }
        @media (max-width: 600px) {
            .container { flex-direction: column; }
            .sidebar { width: 100%; }
            .canvas-area { padding: 20px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <h1>Liquid Ledger</h1>
            <div class="subtitle">液态账本 — 一份活着的、用算法画的账本。每一帧都是货币的流动。</div>

            <div class="control-section">
                <h3>Seed</h3>
                <input type="number" id="seed-input" class="seed-input" value="2024" onchange="updateSeed()">
                <div class="seed-controls">
                    <button class="button secondary" onclick="previousSeed()">← Prev</button>
                    <button class="button secondary" onclick="nextSeed()">Next →</button>
                </div>
                <button class="button tertiary regen-button" onclick="randomSeedAndUpdate()">↻ Random</button>
            </div>

            <div class="control-section">
                <h3>Parameters</h3>

                <div class="control-group">
                    <label>货币粒子数 (Activity)</label>
                    <div class="slider-container">
                        <input type="range" id="particleCount" min="500" max="6000" step="100" value="3000" oninput="updateParam('particleCount', this.value)">
                        <span class="value-display" id="particleCount-value">3000</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>流速 (Market Speed)</label>
                    <div class="slider-container">
                        <input type="range" id="flowSpeed" min="0.2" max="3.0" step="0.1" value="1.0" oninput="updateParam('flowSpeed', this.value)">
                        <span class="value-display" id="flowSpeed-value">1.0</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>市场波动尺度 (Noise Scale)</label>
                    <div class="slider-container">
                        <input type="range" id="noiseScale" min="0.001" max="0.015" step="0.0005" value="0.004" oninput="updateParam('noiseScale', this.value)">
                        <span class="value-display" id="noiseScale-value">0.004</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>账户核数 (Accounts)</label>
                    <div class="slider-container">
                        <input type="range" id="nucleusCount" min="2" max="14" step="1" value="6" oninput="updateParam('nucleusCount', this.value)">
                        <span class="value-display" id="nucleusCount-value">6</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>轨迹持久度 (Trail Fade)</label>
                    <div class="slider-container">
                        <input type="range" id="trailFade" min="2" max="40" step="1" value="12" oninput="updateParam('trailFade', this.value)">
                        <span class="value-display" id="trailFade-value">12</span>
                    </div>
                </div>
            </div>

            <div class="control-section">
                <h3>调色板</h3>
                <div class="color-group">
                    <label>储蓄沉淀 (Savings)</label>
                    <div class="color-picker-container">
                        <input type="color" id="color1" value="#3A8A82" onchange="updateColor('color1', this.value)">
                        <span class="color-value" id="color1-value">#3A8A82</span>
                    </div>
                </div>
                <div class="color-group">
                    <label>收入注入 (Income)</label>
                    <div class="color-picker-container">
                        <input type="color" id="color2" value="#7FB069" onchange="updateColor('color2', this.value)">
                        <span class="color-value" id="color2-value">#7FB069</span>
                    </div>
                </div>
                <div class="color-group">
                    <label>支出抽取 (Expense)</label>
                    <div class="color-picker-container">
                        <input type="color" id="color3" value="#D97757" onchange="updateColor('color3', this.value)">
                        <span class="color-value" id="color3-value">#D97757</span>
                    </div>
                </div>
            </div>

            <div class="control-section">
                <h3>Actions</h3>
                <div class="button-row">
                    <button class="button" onclick="resetParameters()">Reset</button>
                    <button class="button secondary" onclick="exportImage()">Save PNG</button>
                </div>
            </div>
        </div>

        <div class="canvas-area">
            <div id="canvas-container">
                <div class="loading">Initializing ledger...</div>
            </div>
        </div>
    </div>

    <script>
        // ═══════════════════════════════════════════════════════════════════════
        // LIQUID LEDGER — 算法实现
        // 哲学：账户余额 = 流场中粒子受账户核调制的合成运动
        // ═══════════════════════════════════════════════════════════════════════

        let params = {
            seed: 2024,
            particleCount: 3000,
            flowSpeed: 1.0,
            noiseScale: 0.004,
            nucleusCount: 6,
            trailFade: 12,
            colorPalette: ['#3A8A82', '#7FB069', '#D97757']
        };

        let defaultParams = {...params};

        // 系统状态
        let particles = [];
        let nuclei = [];
        let flowField = [];
        let cols, rows;
        let scl = 12;
        let time = 0;
        let palette;

        // ═══════════════════════════════════════════════════════════════════════
        // 工具：颜色处理
        // ═══════════════════════════════════════════════════════════════════════

        function hexToRgb(hex) {
            const r = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return r ? {
                r: parseInt(r[1], 16),
                g: parseInt(r[2], 16),
                b: parseInt(r[3], 16)
            } : null;
        }

        function rebuildPalette() {
            palette = params.colorPalette.map(hexToRgb);
        }

        // 在三个调色板颜色间按 t∈[0,1] 插值
        // t < 0.5: 储蓄 -> 收入; t >= 0.5: 收入 -> 支出
        function colorAt(t) {
            t = constrain(t, 0, 1);
            let c1, c2, local;
            if (t < 0.5) {
                c1 = palette[0]; c2 = palette[1]; local = t * 2;
            } else {
                c1 = palette[1]; c2 = palette[2]; local = (t - 0.5) * 2;
            }
            return {
                r: Math.round(c1.r + (c2.r - c1.r) * local),
                g: Math.round(c1.g + (c2.g - c1.g) * local),
                b: Math.round(c1.b + (c2.b - c1.b) * local)
            };
        }

        // ═══════════════════════════════════════════════════════════════════════
        // 账户核：吸引子与排斥子
        // ═══════════════════════════════════════════════════════════════════════

        class Nucleus {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.homeX = x;
                this.homeY = y;
                this.type = type; // 'attractor' (储蓄) or 'repeller' (支出)
                this.strength = random(40, 120);
                this.phase = random(TWO_PI);
                this.driftR = random(20, 80);
            }

            update() {
                // 账户核在画布上缓慢漂移（账户结构随时间微调）
                this.x = this.homeX + cos(time * 0.0008 + this.phase) * this.driftR;
                this.y = this.homeY + sin(time * 0.0006 + this.phase * 1.3) * this.driftR;
            }
        }

        // ═══════════════════════════════════════════════════════════════════════
        // 粒子：货币单位
        // ═══════════════════════════════════════════════════════════════════════

        class Particle {
            constructor() {
                this.reset(true);
            }

            reset(initial) {
                this.x = initial ? random(width) : (random() < 0.5 ? 0 : width);
                this.y = initial ? random(height) : (random() < 0.5 ? 0 : height);
                this.vx = 0;
                this.vy = 0;
                this.life = random(60, 220);
                this.maxLife = this.life;
                this.speed = 0;
            }

            step() {
                // 1. 采样流场方向
                let col = floor(this.x / scl);
                let row = floor(this.y / scl);
                col = constrain(col, 0, cols - 1);
                row = constrain(row, 0, rows - 1);
                let idx = col + row * cols;
                let angle = flowField[idx];
                let fx = cos(angle);
                let fy = sin(angle);

                // 2. 账户核调制（吸引力/排斥力）
                let nx = 0, ny = 0;
                for (let n of nuclei) {
                    let dx = n.x - this.x;
                    let dy = n.y - this.y;
                    let d2 = dx * dx + dy * dy;
                    let d = Math.sqrt(d2) + 0.01;
                    let falloff = n.strength / d;
                    if (n.type === 'attractor') {
                        nx += (dx / d) * falloff;
                        ny += (dy / d) * falloff;
                    } else {
                        nx -= (dx / d) * falloff * 0.7;
                        ny -= (dy / d) * falloff * 0.7;
                    }
                }

                // 3. 合成速度
                this.vx = (this.vx + fx + nx * 0.04) * 0.92;
                this.vy = (this.vy + fy + ny * 0.04) * 0.92;
                this.x += this.vx * params.flowSpeed;
                this.y += this.vy * params.flowSpeed;
                this.speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);

                // 4. 寿命递减
                this.life -= 1;

                // 5. 边界或寿命终结 → 重生
                if (this.life <= 0 || this.x < -10 || this.x > width + 10 || this.y < -10 || this.y > height + 10) {
                    this.reset(false);
                }
            }

            display() {
                // 颜色 t 由「到最近吸引子的距离」决定 + 「速度」微调
                let nearestD = Infinity;
                let nearestType = 'attractor';
                for (let n of nuclei) {
                    let dx = n.x - this.x;
                    let dy = n.y - this.y;
                    let d = Math.sqrt(dx * dx + dy * dy);
                    if (d < nearestD) {
                        nearestD = d;
                        nearestType = n.type;
                    }
                }
                let t = constrain(nearestD / 320, 0, 1);
                // 排斥核附近的粒子偏向支出色
                if (nearestType === 'repeller') t = 0.5 + t * 0.5;
                let c = colorAt(t);

                // 透明度由年龄 + 速度决定
                let ageRatio = this.life / this.maxLife;
                let alpha = constrain(80 + ageRatio * 160 + this.speed * 8, 60, 240);

                // 渲染为细线段，模拟流体轨迹
                let speedMag = Math.min(this.speed * 6, 4);
                stroke(c.r, c.g, c.b, alpha);
                strokeWeight(1);
                line(this.x, this.y, this.x - this.vx * speedMag, this.y - this.vy * speedMag);
            }
        }

        // ═══════════════════════════════════════════════════════════════════════
        // 流场生成（多层 Perlin 噪声）
        // ═══════════════════════════════════════════════════════════════════════

        function generateFlowField() {
            let xoff = 0, yoff = 0;
            for (let y = 0; y < rows; y++) {
                xoff = 0;
                for (let x = 0; x < cols; x++) {
                    // 多 octaves 叠加：低频是经济周期，高频是消费冲动
                    let n1 = noise(xoff, yoff, time * 0.0003);
                    let n2 = noise(xoff * 2.5, yoff * 2.5, time * 0.0006);
                    let n = n1 * 0.7 + n2 * 0.3;
                    let angle = n * TWO_PI * 2;
                    flowField[x + y * cols] = angle;
                    xoff += params.noiseScale;
                }
                yoff += params.noiseScale;
            }
        }

        // ═══════════════════════════════════════════════════════════════════════
        // P5.JS 生命周期
        // ═══════════════════════════════════════════════════════════════════════

        function setup() {
            let canvas = createCanvas(1000, 1000);
            canvas.parent('canvas-container');
            initializeSystem();
            document.querySelector('.loading').style.display = 'none';
        }

        function initializeSystem() {
            randomSeed(params.seed);
            noiseSeed(params.seed);
            rebuildPalette();

            cols = floor(width / scl);
            rows = floor(height / scl);
            flowField = new Array(cols * rows);

            // 创建账户核：吸引子 + 排斥子混合
            nuclei = [];
            for (let i = 0; i < params.nucleusCount; i++) {
                let type = (i % 3 === 0) ? 'repeller' : 'attractor';
                let nx = random(width * 0.15, width * 0.85);
                let ny = random(height * 0.15, height * 0.85);
                nuclei.push(new Nucleus(nx, ny, type));
            }

            // 创建粒子
            particles = [];
            for (let i = 0; i < params.particleCount; i++) {
                particles.push(new Particle());
            }

            // 浅米色背景（账本的纸张）
            background(250, 249, 245);

            generateFlowField();
            time = 0;
        }

        function draw() {
            // 残影：让旧轨迹渐隐
            noStroke();
            fill(250, 249, 245, params.trailFade);
            rect(0, 0, width, height);

            // 账户核演化
            for (let n of nuclei) n.update();

            // 流场随时间缓慢演化
            if (frameCount % 6 === 0) generateFlowField();

            // 粒子更新与渲染
            for (let p of particles) {
                p.step();
                p.display();
            }

            // 账户核光晕
            noStroke();
            for (let n of nuclei) {
                let c = n.type === 'attractor' ? palette[0] : palette[2];
                let pulse = 18 + sin(time * 0.05 + n.phase) * 6;
                for (let r = pulse; r > 0; r -= 3) {
                    fill(c.r, c.g, c.b, map(r, 0, pulse, 18, 0));
                    ellipse(n.x, n.y, r * 2);
                }
                fill(255);
                ellipse(n.x, n.y, 5);
            }

            time++;
        }

        // ═══════════════════════════════════════════════════════════════════════
        // UI 控制
        // ═══════════════════════════════════════════════════════════════════════

        function updateParam(name, value) {
            params[name] = parseFloat(value);
            document.getElementById(name + '-value').textContent = value;
            // 影响结构的参数需要重建系统
            if (name === 'particleCount') {
                particles = [];
                for (let i = 0; i < params.particleCount; i++) particles.push(new Particle());
            } else if (name === 'nucleusCount') {
                nuclei = [];
                randomSeed(params.seed);
                for (let i = 0; i < params.nucleusCount; i++) {
                    let type = (i % 3 === 0) ? 'repeller' : 'attractor';
                    nuclei.push(new Nucleus(random(width * 0.15, width * 0.85), random(height * 0.15, height * 0.85), type));
                }
            } else if (name === 'noiseScale') {
                generateFlowField();
            }
        }

        function updateColor(id, value) {
            let idx = { color1: 0, color2: 1, color3: 2 }[id];
            params.colorPalette[idx] = value;
            document.getElementById(id + '-value').textContent = value;
            rebuildPalette();
        }

        function updateSeedDisplay() {
            document.getElementById('seed-input').value = params.seed;
        }

        function updateSeed() {
            let input = document.getElementById('seed-input');
            let newSeed = parseInt(input.value);
            if (newSeed && newSeed > 0) {
                params.seed = newSeed;
                initializeSystem();
            } else {
                updateSeedDisplay();
            }
        }

        function previousSeed() {
            params.seed = Math.max(1, params.seed - 1);
            updateSeedDisplay();
            initializeSystem();
        }

        function nextSeed() {
            params.seed = params.seed + 1;
            updateSeedDisplay();
            initializeSystem();
        }

        function randomSeedAndUpdate() {
            params.seed = Math.floor(Math.random() * 999999) + 1;
            updateSeedDisplay();
            initializeSystem();
        }

        function resetParameters() {
            params = {...defaultParams};
            document.getElementById('particleCount').value = params.particleCount;
            document.getElementById('particleCount-value').textContent = params.particleCount;
            document.getElementById('flowSpeed').value = params.flowSpeed;
            document.getElementById('flowSpeed-value').textContent = params.flowSpeed;
            document.getElementById('noiseScale').value = params.noiseScale;
            document.getElementById('noiseScale-value').textContent = params.noiseScale;
            document.getElementById('nucleusCount').value = params.nucleusCount;
            document.getElementById('nucleusCount-value').textContent = params.nucleusCount;
            document.getElementById('trailFade').value = params.trailFade;
            document.getElementById('trailFade-value').textContent = params.trailFade;
            document.getElementById('color1').value = params.colorPalette[0];
            document.getElementById('color1-value').textContent = params.colorPalette[0];
            document.getElementById('color2').value = params.colorPalette[1];
            document.getElementById('color2-value').textContent = params.colorPalette[1];
            document.getElementById('color3').value = params.colorPalette[2];
            document.getElementById('color3-value').textContent = params.colorPalette[2];
            updateSeedDisplay();
            initializeSystem();
        }

        function exportImage() {
            saveCanvas('liquid-ledger-' + params.seed, 'png');
        }

        window.addEventListener('load', updateSeedDisplay);
    </script>
</body>
</html>
