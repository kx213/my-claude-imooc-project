<input class="rounded text-primary focus:ring-primary/50" id="remember-me" type="checkbox">
<span class="">记住我</span>

</div>
<p class="text-body-xs text-outline mt-1 hidden" id="reg-user-hint"></p>
</div>
<div>
<label class="block text-label-sm text-on-surface-variant mb-1">密码</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-lg">key</span>
</span>
<input class="w-full pl-10 pr-10 py-2.5 bg-surface-container-low text-on-surface rounded-lg text-body-md focus:outline-none focus:ring-2 focus:ring-primary/50 transition-all placeholder:text-outline-variant" id="reg-password" placeholder="至少6位安全密码" required="" type="password">
<button class="absolute inset-y-0 right-0 pr-3 flex items-center text-outline hover:text-on-surface" onclick="togglePassword('reg-password')" type="button">
<span class="material-symbols-outlined text-lg">visibility</span>
</button>
</div>
</div>
<div>
<label class="block text-label-sm text-on-surface-variant mb-1">确认密码</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-outline">

</span>
<input class="w-full pl-10 pr-4 py-2.5 bg-surface-container-low text-on-surface rounded-lg text-body-md focus:outline-none focus:ring-2 focus:ring-primary/50 transition-all placeholder:text-outline-variant" id="reg-password-confirm" placeholder="再次输入密码" required="" type="password">

</div>
<div class="pt-2">
<button class="w-full py-3 bg-primary text-on-primary rounded-lg text-label-md font-medium shadow-md hover:bg-surface-tint transition-all flex items-center justify-center gap-space-sm" type="submit">
<span class="">创建账本并注册</span>
<span class="material-symbols-outlined text-lg">check_circle</span>
</button>
</div>
</form>
</div>
<!-- Footer Security Badge -->
<div class="px-8 py-4 bg-mint-surface/50 border-t border-outline-variant/10 flex items-center justify-center gap-space-sm text-body-xs text-outline">
<span class="material-symbols-outlined text-base text-primary">verified_user</span>
<span class="">PBKDF2 本地高强度加密保护 · 数据仅存浏览器</span>
</div>
</div>
<!-- Recovery Modal -->
<div class="fixed inset-0 bg-inverse-surface/40 backdrop-blur-sm z-50 flex items-center justify-center hidden opacity-0 transition-opacity duration-300 p-4" id="recovery-modal">
<div class="bg-surface-container-lowest rounded-xl shadow-2xl max-w-md w-full p-6 transform scale-95 transition-transform duration-300" id="recovery-modal-content">
<div class="flex items-center justify-between mb-4">
<div class="flex items-center gap-space-sm">

<span class="material-symbols-outlined">help_outline</span>
</div>

</div>
<button class="text-outline hover:text-on-surface" onclick="closeRecoveryModal()">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<div class="space-y-4 text-body-md text-on-surface-variant">
<div class="p-3 bg-surface-container-low rounded-lg border-l-4 border-warm-amber">
<p class="text-body-sm text-on-surface font-medium">⚠️ 无法找回密码提示</p>
<p class="text-body-xs text-outline mt-1">本系统采用纯前端 LocalStorage 存储，所有数据及密钥均不上传云端。若遗忘密码，服务器无法帮您找回。</p>
</div>
<div class="space-y-2">
<p class="text-label-md text-on-surface">可用排查与恢复选项：</p>
<div class="grid grid-cols-1 gap-2">
<button class="w-full py-2.5 px-4 bg-error-container text-on-error-container rounded-lg text-label-sm font-medium hover:bg-error/20 transition-all flex items-center justify-between" onclick="triggerResetStorage()">
<span class="">清空本地所有数据并重置</span>
<span class="material-symbols-outlined text-sm">delete_sweep</span>
</button>
<label class="w-full py-2.5 px-4 bg-secondary-container text-on-secondary-container rounded-lg text-label-sm font-medium hover:bg-secondary-fixed transition-all flex items-center justify-between cursor-pointer">
<span class="">从 JSON 备份文件恢复账号</span>
<span class="material-symbols-outlined text-sm">upload_file</span>
<input accept=".json" class="hidden" onchange="restoreFromJson(event)" type="file">
</label>
</div>
</div>
</div>
<div class="mt-6 flex justify-end">
<button class="px-4 py-2 bg-surface-container text-on-surface rounded-lg text-label-sm font-medium" onclick="closeRecoveryModal()">关闭</button>
</div>
</div>
</div>
<script>
    // Tab switching logic
    function switchTab(tab) {
      const loginForm = document.getElementById('form-login');
      const regForm = document.getElementById('form-register');
      const tabLogin = document.getElementById('tab-login');
      const tabReg = document.getElementById('tab-register');
      hideAlert();

      if (tab === 'login') {
        loginForm.classList.remove('hidden');
        regForm.classList.add('hidden');
        tabLogin.className = 'flex-1 py-2 text-label-md rounded-md transition-all duration-200 bg-surface-container-lowest text-primary shadow-sm';
        tabReg.className = 'flex-1 py-2 text-label-md rounded-md transition-all duration-200 text-outline hover:text-on-surface';
      } else {
        loginForm.classList.add('hidden');
        regForm.classList.remove('hidden');
        tabReg.className = 'flex-1 py-2 text-label-md rounded-md transition-all duration-200 bg-surface-container-lowest text-primary shadow-sm';
        tabLogin.className = 'flex-1 py-2 text-label-md rounded-md transition-all duration-200 text-outline hover:text-on-surface';
      }
    }

    // Toggle password visibility
    function togglePassword(id) {
      const input = document.getElementById(id);
      input.type = input.type === 'password' ? 'text' : 'password';
    }

    // Alert banner helper
    function showAlert(message, type = 'error') {
      const banner = document.getElementById('alert-banner');
      const text = document.getElementById('alert-text');
      const icon = document.getElementById('alert-icon');
      
      banner.classList.remove('hidden');
      text.innerText = message;
      
      if (type === 'error') {
        banner.className = 'mb-4 p-3 rounded-lg text-body-sm transition-all flex items-center gap-space-sm bg-error-container text-on-error-container';
        icon.innerText = 'error';
      } else {
        banner.className = 'mb-4 p-3 rounded-lg text-body-sm transition-all flex items-center gap-space-sm bg-primary-container text-on-primary-container';
        icon.innerText = 'check_circle';
      }
    }

    function hideAlert() {
      document.getElementById('alert-banner').classList.add('hidden');
    }

    // PBKDF2 Simulation Helper (Using Web Crypto API)
    async function hashPassword(password, salt) {
      const enc = new TextEncoder();
      const keyMaterial = await window.crypto.subtle.importKey(
        "raw",
        enc.encode(password),
        { name: "PBKDF2" },
        false,
        ["deriveBits", "deriveKey"]
      );
      const derivedBits = await window.crypto.subtle.deriveBits(
        {
          name: "PBKDF2",
          salt: enc.encode(salt),
          iterations: 10000,
          hash: "SHA-256"
        },
        keyMaterial,
        256
      );
      return Array.from(new Uint8Array(derivedBits))
        .map(b => b.toString(16).padStart(2, '0'))
        .join('');
    }

    // Anti-brute force cooldown state
    let failedAttempts = 0;
    let lockoutTimer = null;

    // Login Handler
    async function handleLogin(e) {
      e.preventDefault();
      if (lockoutTimer) return;

      const username = document.getElementById('login-username').value.trim();
      const password = document.getElementById('login-password').value;
      const btn = document.getElementById('login-btn');

      btn.disabled = true;
      btn.innerHTML = `<span class="material-symbols-outlined animate-spin text-lg">progress_activity</span><span>安全验证中...</span>`;

      // Simulate network / crypto delay
      await new Promise(r => setTimeout(r, 600));

      const users = JSON.parse(localStorage.getItem('mint_users') || '{}');
      const user = users[username];

      if (!user) {
        handleFailedLogin();
        return;
      }

      const hashedPassword = await hashPassword(password, user.salt);
      if (hashedPassword === user.hash) {
        // Success
        failedAttempts = 0;
        localStorage.setItem('mint_current_user', username);
        showAlert('登录成功，正在加载账本...', 'success');
        setTimeout(() => {
          // Trigger transition or reload
          window.location.reload();
        }, 800);
      } else {
        handleFailedLogin();
      }

      btn.disabled = false;
      btn.innerHTML = `<span>安全登录</span><span class="material-symbols-outlined text-lg">arrow_forward</span>`;
    }

    function handleFailedLogin() {
      failedAttempts++;
      if (failedAttempts >= 3) {
        let countdown = 10;
        const notice = document.getElementById('cooldown-notice');
        notice.classList.remove('hidden');
        document.getElementById('login-btn').disabled = true;

        lockoutTimer = setInterval(() => {
          notice.innerText = `密码错误次数过多，为保障安全请等待 ${countdown} 秒后重试`;
          countdown--;
          if (countdown < 0) {
            clearInterval(lockoutTimer);
            lockoutTimer = null;
            notice.classList.add('hidden');
            document.getElementById('login-btn').disabled = false;
            failedAttempts = 0;
          }
        }, 1000);
      }
      showAlert('用户名或密码错误');
    }

    // Register Handler
    async function handleRegister(e) {
      e.preventDefault();
      const username = document.getElementById('reg-username').value.trim();
      const password = document.getElementById('reg-password').value;
      const confirmPwd = document.getElementById('reg-password-confirm').value;

      // Validation: 3-20 chars, alphanumeric, underscore, chinese
      const regex = /^[\u4e00-\u9fa5a-zA-Z0-9_]{3,20}$/;
      if (!regex.test(username)) {
        showAlert('用户名格式不符：需为 3-20 位字母、数字、下划线或中文');
        return;
      }

      if (password.length < 6) {
        showAlert('密码强度不足：请至少输入 6 位密码');
        return;
      }

      if (password !== confirmPwd) {
        showAlert('两次输入的密码不一致');
        return;
      }

      const users = JSON.parse(localStorage.getItem('mint_users') || '{}');
      if (users[username]) {
        showAlert('该用户名已被注册，请更换或直接登录');
        return;
      }

      // Generate Salt & PBKDF2 Hash
      const salt = Math.random().toString(36.substring(2));
      const hash = await hashPassword(password, salt);

      // Save user
      users[username] = { salt, hash, createdAt: new Date().toISOString() };
      localStorage.setItem('mint_users', JSON.stringify(users));

      // Initialize Ledger & Default Categories
      const initialLedger = {
        balance: 0,
        categories: [
          { id: 'c1', name: '餐饮美食', type: 'expense', icon: 'restaurant' },
          { id: 'c2', name: '交通出行', type: 'expense', icon: 'directions_car' },
          { id: 'c3', name: '工资收入', type: 'income', icon: 'payments' },
          { id: 'c4', name: '其他', type: 'expense', icon: 'category' }
        ],
        transactions: []
      };
      localStorage.setItem(`mint_ledger_${username}`, JSON.stringify(initialLedger));
      localStorage.setItem('mint_current_user', username);

      showAlert('注册成功！已为您自动初始化个人账本', 'success');
      setTimeout(() => {
        window.location.reload();
      }, 1000);
    }

    // Recovery Modal Control
    function openRecoveryModal() {
      const modal = document.getElementById('recovery-modal');
      modal.classList.remove('hidden');
      setTimeout(() => modal.classList.remove('opacity-0'), 10);
    }

    function closeRecoveryModal() {
      const modal = document.getElementById('recovery-modal');
      modal.classList.add('opacity-0');
      setTimeout(() => modal.classList.add('hidden'), 300);
    }

    function triggerResetStorage() {
      if (confirm('警告：此操作将清空本地所有账号与账本数据，无法撤销！确认重置吗？')) {
        localStorage.clear();
        alert('本地数据已全部清空。');
        window.location.reload();
      }
    }

    function restoreFromJson(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const data = JSON.parse(e.target.result);
          if (data.users && data.ledgers) {
            localStorage.setItem('mint_users', JSON.stringify(data.users));
            Object.keys(data.ledgers).forEach(k => {
              localStorage.setItem(k, JSON.stringify(data.ledgers[k]));
            });
            alert('账号与数据备份恢复成功！请登录。');
            window.location.reload();
          } else {
            alert('备份文件格式错误');
          }
        } catch(err) {
          alert('解析 JSON 文件失败');
        }
      };
      reader.readAsText(file);
    }
  </script>
</div></main><div class="fixed bottom-space-xl right-space-xl z-50 flex flex-col gap-space-sm pointer-events-none" id="toast-container"></div>
